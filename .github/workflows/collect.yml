name: 蒐集新聞（每小時）

on:
  schedule:
    # 每小時整點執行（GitHub 在尖峰時可能延遲數分鐘）
    - cron: '0 * * * *'
  workflow_dispatch: {} # 也可在 Actions 頁面手動觸發

# 避免上一輪還沒跑完又啟動下一輪
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 若你在 src/lib/sources.ts 加了需要 Playwright 抓取的來源，
      # 取消下面這行的註解，讓 CI 安裝瀏覽器：
      # - run: npx playwright install --with-deps chromium

      - name: 執行蒐集
        run: npm run collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MAX_PER_RUN: '40'
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          RUNWAY_BASE_URL: https://runway.taitra.ai
          RUNWAY_MODEL: claude-haiku,gpt-5-chat
          TRANSLATE_MAX_PER_RUN: '80'
          RETENTION_DAYS: '30'
